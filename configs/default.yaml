# Frozen analysis protocol for "Deep-Time Celestial Reference Networks".
# All numeric manuscript outputs derive from runs under this config.

master_seed: 20260924
n_mc: 2000            # default replications per scenario (core runs)
n_mc_core: 10000      # replications for headline scenarios (see E1_core)
time_grid_years: [1e3, 1e4, 1e5, 1e6, 1e7, 1e8]
time_grid_exploratory_years: [1e9]

sigma_obs_rad: 1.0e-4           # baseline observational direction noise
p_mismatch_baseline: 0.05
mismatch_model: permutation     # primary corruption model
severity_baseline: baseline
estimator_default: ransac
ransac_n_iter: 120
ransac_tol_deg: 2.0
chirality_default: true
mirror_ambiguity: true
encoding_default: b_only        # stored: source IDs + cosines b
bits_default: 32

# outcome thresholds
primary_threshold_deg: 1.0
secondary_thresholds_deg: [0.1, 5.0]
catastrophic_deg: 30.0
