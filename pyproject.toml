[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "proarch"
version = "0.1.0"
description = "Deep-time celestial reference networks for reconstructing terrestrial orientation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "pyyaml>=6.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "tqdm>=4.64"]

[tool.setuptools.packages.find]
where = ["src"]
